[alias]
xtask = "run --quiet --package xtask --"

# Rust does not enable Windows Control Flow Guard by default. Apply it to
# every crate linked into production MSVC binaries, including native callback
# shims around WebView2.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard=yes"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard=yes"]

# Debug executables keep one signature across rebuilds, so the Keychain stops
# asking for the login password after every build (see the script).
# rice fork: ld-27037 (Xcode 27) writes proc-macro dylibs that dyld rejects
# ("mis-aligned LINKEDIT string pool") when MACOSX_DEPLOYMENT_TARGET=14.0,
# which tauri build sets from minimumSystemVersion. Without chained fixups
# the dylibs load.
[target.aarch64-apple-darwin]
runner = "scripts/dev-sign-run.sh"
rustflags = ["-C", "link-arg=-Wl,-no_fixup_chains"]

[target.x86_64-apple-darwin]
runner = "scripts/dev-sign-run.sh"
rustflags = ["-C", "link-arg=-Wl,-no_fixup_chains"]
